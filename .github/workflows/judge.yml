# Every night (02:00 IST), a free OpenRouter model scores a sample of the day's agent conversations and the
# scores land on each trace in Opik. Needs repository secrets OPIK_API_KEY and OPENROUTER_API_KEY.
name: Nightly judge

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to look"
        default: "24"
      sample:
        description: "Share of conversations to judge (0-1)"
        default: "0.25"

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Score the day's conversations
        env:
          OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPIK_WORKSPACE: mohammad-rizwan
          OPIK_PROJECT_NAME: Portfolio agent
          HOURS: ${{ inputs.hours || '24' }}
          SAMPLE: ${{ inputs.sample || '0.25' }}
        run: node scripts/judge-nightly.mjs
