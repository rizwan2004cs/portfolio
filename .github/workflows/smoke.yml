# After Vercel finishes a production deploy, the live site must answer on its public address:
# the home page, the agent, the resume and a write-up. Needs no token: Vercel reports the deploy to GitHub.
name: Smoke check

on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.SITE_URL || 'https://mohammad-rizwan.tech' }}
    steps:
      - name: Live pages answer 200
        run: |
          for path in / /agent /resume.pdf /work/pack /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$URL$path")
            echo "$path → $code"; [ "$code" = 200 ] || exit 1
          done
      # IndexNow: tell Bing (and Yandex, Seznam, Naver) every page is fresh, so they recrawl within a day.
      # The key is public by design: it is served at /<key>.txt to prove the site owns the ping.
      - name: Ping IndexNow
        env:
          KEY: 5e16afe77cb445ed41e9b62af972d507
        run: |
          host=$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')
          urls=$(curl -s "$URL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          body=$(jq -n --arg host "$host" --arg key "$KEY" --arg loc "$URL/$KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow → $code for $(echo "$urls" | jq length) URLs"; [ "$code" = 200 ] || [ "$code" = 202 ]
