# Build, types, lint, unit + golden tests, then the browser suite. Every push and pull request runs it
# through deploy.yml (which deploys only what passes), so it is not triggered twice from here.
# No model keys here: the e2e server answers from the deterministic router, so runs are free and repeatable.
name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live golden suite against Groq (uses the GROQ_API_KEY secret)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_DIST_DIR: .next-e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      # the build writes next-env.d.ts and the route types the type check reads, so it goes first
      - name: Build
        run: npx next build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and golden tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + phone)
        run: npx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  live-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run build
      - name: live golden suite (attacks, grounding, legit)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          npm run eval:live
