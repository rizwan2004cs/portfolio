# Build, types, lint, unit + golden tests, then the browser suite, on every push and pull request.
# Vercel's Git integration deploys (previews for pull requests, production for main); branch protection
# on main requires this "check" job to pass before a pull request can merge.
# No model keys here: the e2e server answers from the deterministic router, so runs are free and repeatable.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live golden suite against Groq (uses the GROQ_API_KEY secret)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_DIST_DIR: .next-e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      # the build writes next-env.d.ts and the route types the type check reads, so it goes first
      - name: Build
        run: npx next build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and golden tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + phone)
        run: npx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # the labelled message set against the live classifier: reports every misread kind; does not block a merge,
  # because a free endpoint being slow must not stop a deploy
  intents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # each run spends ~1 free-tier request per message, from the same daily budget the live site uses:
      # only when the policy, the classifier or the labelled set changed, or when started by hand
      - name: Did the behaviour change?
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^(src/agent/(behavior|classify)\.ts|tests/fixtures/intents\.json|scripts/eval-intents\.mjs)$'; then echo run=1 >> "$GITHUB_OUTPUT"; else echo "behaviour unchanged: skipping"; fi
      - name: Classifier eval
        if: steps.changed.outputs.run == '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/eval-intents.mjs

  live-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run build
      - name: live golden suite (attacks, grounding, legit)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          npm run eval:live
