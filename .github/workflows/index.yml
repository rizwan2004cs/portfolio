# The facts index in Neon (pgvector) is rebuilt by every Vercel build (`npm run build` ends with scripts/index-facts.ts,
# and the build has DATABASE_URL and NVIDIA_API_KEY). This workflow is a by-hand rebuild for when the database changes;
# it needs repository secrets DATABASE_URL and NVIDIA_API_KEY.
name: Facts index

on:
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Embed and upsert the facts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: REQUIRE_INDEX=1 npx tsx scripts/index-facts.ts
