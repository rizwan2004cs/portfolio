# Every push and pull request runs CI (ci.yml) first; what passes is deployed:
# a preview for every pull request, production for every push to main.
# Needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The model keys live in the Vercel project's environment variables, never in this repo or its secrets.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cut a production deploy off halfway

permissions:
  contents: read
  pull-requests: write # the preview URL is posted on the pull request

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@54.14.2

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # forks get no secrets: their pull requests are tested, not deployed
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Check the Vercel secrets are set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Pull Vercel settings
        run: npx $VERCEL_CLI pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx $VERCEL_CLI build ${{ env.TARGET == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(npx $VERCEL_CLI deploy --prebuilt ${{ env.TARGET == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"

      # production must answer: the home page, the agent, the resume and the agent API
      - name: Smoke check
        if: env.TARGET == 'production'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /agent /resume.pdf /work/pack; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$URL$path")
            echo "$path → $code"; [ "$code" = 200 ] || exit 1
          done

      - name: Post the preview URL
        if: env.TARGET == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "Preview: $URL" --edit-last --create-if-none
