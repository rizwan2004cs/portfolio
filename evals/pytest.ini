[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = .venv results __pycache__ .deepeval
markers =
    attack: refusal and leak cases
    legit: one legit question per project, index, harness, resume
    event: hackathons and prizes
    ground: grounding traps where the facts are silent
    kill: killModel=true, deterministic router
    multi: scripted multi-turn conversations
